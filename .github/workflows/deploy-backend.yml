name: deploy-backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wee-cook-api
  # 服务器上 API 的宿主侧地址，与服务器 .env 的 API_ADDR 必须一致（改一处就两处一起改）。
  API_ADDR: 127.0.0.1:8081

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      # testcontainers 会起真的 postgres 容器，ubuntu-latest 自带 Docker，无需额外装配。
      - name: 跑测试
        run: go test ./...

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # 服务器到 ghcr.io 的链路实测约 13 KB/s，拉一个镜像层就要十几分钟；
          # 默认 10 分钟会在拉取中途把 SSH 会话掉断（"Run Command Timeout"）。
          command_timeout: 45m
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            # --quiet：进度日志能刷几千行，把真正的报错顶出视野。
            docker compose pull --quiet api
            # --no-build：compose 里有 build: ./backend，不加这个可能在服务器上现场编译一遍。
            docker compose up -d --no-build
            # 容器起来就崩（迁移失败、配置写错）时 compose 的退出码仍是 0，
            # 不打这一枪这次部署会显示成绿色。distroless 镜像里没有 curl/wget，
            # 只能从宿主机打映射出来的端口。
            #
            # 用显式循环而不是 curl --retry：刚 Started 时 docker-proxy 给的是
            # ECONNRESET(56)，它不在 curl 默认重试范围内（--retry-all-errors 又要
            # curl 7.71+，不想给服务器再加一个版本前提）。
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null "http://${{ env.API_ADDR }}/api/v1/healthz"; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::等了 60s 健康检查仍未通过，最近 50 行容器日志："
              docker compose logs --tail=50 api
              exit 1
            fi
            echo "健康检查通过：http://${{ env.API_ADDR }}/api/v1/healthz"
