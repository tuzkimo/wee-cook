[package]
name = "wee-cook"
version = "1.1.0"
description = "一起做饭 - 离线优先的家庭菜谱管理 App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wee_cook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
tauri-plugin-tts = "=0.2.1"

# stt 桌面侧走 whisper.cpp（需要 libclang + cmake），桌面端本来就不做语音，只在移动端编译。
# 见 docs/superpowers/specs/2026-10-18-voice-guidance-design.md §3。
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-stt = "=0.2.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
