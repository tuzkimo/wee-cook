services:
  api:
    # build 与 image 同时存在：up 时本地构建（不依赖镜像已发布），镜像发布后可 pull 使用。
    build: ./backend
    image: ghcr.io/tuzkimo/wee-cook-api:latest
    restart: unless-stopped
    # 整个宿主侧地址都可覆盖：本地不设 = 8080 全接口（安卓实机联调照旧）；
    # 服务器 .env 写 API_ADDR=127.0.0.1:8081 = 只有本机反代能进，公网摸不到。
    ports: ["${API_ADDR:-8080}:8080"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-wee}:${POSTGRES_PASSWORD:-wee}@postgres:5432/${POSTGRES_DB:-wee-cook}?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://tauri.localhost}
      # 服务位于可信反向代理（Caddy 等）之后时设为 true；直连暴露 8080 时保持 false（默认）。
      TRUST_PROXY: ${TRUST_PROXY:-false}
      FILES_DIR: /data/files
      # AI 菜谱助手：全部可选，留空即关闭（不配也必须能起来）。变量与默认值见 docs/SELF-HOSTING.md。
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-}
      AI_TIMEOUT: ${AI_TIMEOUT:-}
      AI_RATE_LIMIT: ${AI_RATE_LIMIT:-}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-}
      # 上游需要经代理访问时填（本地与线上都可能需要，地址各自填）；留空 = 直连。
      # 映射到容器内的标准变量名，Go 的默认 Transport 据此走代理。
      HTTP_PROXY: ${AI_HTTP_PROXY:-}
      HTTPS_PROXY: ${AI_HTTPS_PROXY:-}
      NO_PROXY: ${AI_NO_PROXY:-localhost,127.0.0.1,postgres,redis}
    volumes: [files:/data/files]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wee}
      POSTGRES_DB: ${POSTGRES_DB:-wee-cook}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wee} -d ${POSTGRES_DB:-wee-cook}"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  files:
